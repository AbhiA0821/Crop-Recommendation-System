<!DOCTYPE html>
<html>
<head>
    <title>Crop Recommendation</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #56ab2f, #a8e063);
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
        }

        h2 {
            color: #2e7d32;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            color: #1b5e20;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🌱 Crop Recommendation</h2>

    <form action="/predict" method="post">
        <input type="text" name="N" placeholder="Nitrogen" required>
        <input type="text" name="P" placeholder="Phosphorus" required>
        <input type="text" name="K" placeholder="Potassium" required>
        <input type="text" name="temperature" placeholder="Temperature" required>
        <input type="text" name="humidity" placeholder="Humidity" required>
        <input type="text" name="ph" placeholder="pH" required>
        <input type="text" name="rainfall" placeholder="Rainfall" required>

        <button type="submit">🌾 Predict Crop</button>
    </form>

    <div class="result">
        {{ prediction_text }}
    </div>
</div>

</body>
</html>
